<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Filidilo mudou de endereço</title>
<script>
  // Leva /tatino/<resto>?<busca>#<hash> para /filidilo/<resto>?<busca>#<hash>.
  // Mantém ?b=<código> (links e desafios) e ?teste=1.
  ;(function () {
    var l = window.location
    var caminho = l.pathname.replace(/^\/tatino(\/|$)/, '/filidilo/')
    if (caminho.indexOf('/filidilo/') !== 0) caminho = '/filidilo/'
    l.replace(caminho + l.search + l.hash)
  })()
</script>
<link rel="canonical" href="https://marcelobritonet.github.io/filidilo/">

  a { color: #7FD3E8; }
</style>
